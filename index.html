<!DOCTYPE html>
<html lang="en">
<head>
    <title>Continental Hotel Reservation Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background-color: #e6f2ff;
            border: 2px solid #333;
            padding: 20px;
            width: 450px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: red;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            border: 1px solid #777;
            padding: 8px;
            vertical-align: middle;
        }
        .label-col {
            font-weight: bold;
            text-align: right;
            width: 30%;
            background-color: #d0e6ff;
        }
        input[type="text"], input[type="email"] {
            width: 95%;
            padding: 4px;
            border: 1px solid #aaa;
        }
        .departure-inputs input {
            width: 40%;
            display: inline-block;
        }
        .options-group {
            line-height: 1.6;
        }
        .options-group label {
            margin-right: 10px;
            display: inline-block;
        }
        .btn-container {
            text-align: center;
            margin-top: 15px;
        }
        input[type="submit"] {
            padding: 5px 15px;
            background-color: #f0f0f0;
            border: 1px solid #777;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Continental Hotel Reservation Form</h2>
    <form>
        <table>
            <tr>
                <td class="label-col">Name</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td class="label-col">eMail</td>
                <td><input type="email" value="info@continental.pk"></td>
            </tr>
            <tr>
                <td class="label-col">Mobile No</td>
                <td><input type="text" placeholder="Enter your cell number"></td>
            </tr>
            <tr>
                <td class="label-col">Arrival Time</td>
                <td><input type="text" placeholder="Enter your arrival time"></td>
            </tr>
            <tr>
                <td class="label-col">Departure</td>
                <td class="departure-inputs">
                    <input type="text"> 
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td class="label-col">Room Type</td>
                <td class="options-group">
                    <label><input type="radio" name="room"> Single</label>
                    <label><input type="radio" name="room"> Double</label><br>
                    <label><input type="radio" name="room"> Presidential Suite</label>
                </td>
            </tr>
            <tr>
                <td class="label-col">Preferences</td>
                <td class="options-group">
                    <label><input type="checkbox"> Non-Smoking</label><br>
                    <label><input type="checkbox"> Internet</label><br>
                    <label><input type="checkbox"> Firm Mattress</label>
                </td>
            </tr>
            <tr>
                <td class="label-col">Mode of Payment</td>
                <td class="options-group">
                    <label><input type="checkbox"> Cash</label>
                    <label><input type="checkbox"> Check</label><br>
                    <label><input type="checkbox"> Credit Card</label>
                    <select>
                        <option>Select Card</option>
                    </select>
                </td>
            </tr>
        </table>
        <div class="btn-container">
            <input type="submit" value="Send Data">
        </div>
    </form>
</div>

</body>
</html>
